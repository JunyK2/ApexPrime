name: ApexPrime — scan horário

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: apexprime-paper-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Executar scan e gerenciar trades virtuais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHART_IMG_API_KEY: ${{ secrets.CHART_IMG_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_TRADING_ONLY: 'true'
          MAX_ENTRY_DEVIATION_PCT: '0.25'
          PENDING_ENTRY_EXPIRY_HOURS: '12'
        run: python -m apexprime.main hourly
